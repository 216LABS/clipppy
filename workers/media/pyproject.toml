[project]
name = "clipppy-media"
version = "0.1.0"
description = "Clipppy media worker. CPU ffmpeg fallback until a GPU provider is benchmarked."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[dependency-groups]
dev = ["pytest>=8.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipppy_media"]
